spring:
  application:
    name: nummus
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nummus}
    username: ${DB_USER:nummus_app}
    password: ${DB_PASSWORD:nummus_app}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nummus}
    user: ${FLYWAY_USER:nummus_owner}
    password: ${FLYWAY_PASSWORD:nummus_owner}
